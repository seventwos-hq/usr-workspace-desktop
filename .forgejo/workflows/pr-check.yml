name: pr-check
on: pull_request
permissions:
  contents: read
jobs:
  pr-check:
    runs-on: dev-vm
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm lint:js
      - run: pnpm -r --workspace-concurrency=1 lint:types
      - run: pnpm test:unit
