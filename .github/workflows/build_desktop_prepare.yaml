name: Prepare Seventwos Desktop Build

on:
    workflow_call:
        inputs:
            config:
                type: string
                required: true
                description: "Repository-relative config directory under apps/desktop"

permissions:
    contents: read

jobs:
    prepare:
        name: Build web app from source and prepare desktop inputs
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: apps/desktop/.node-version
                  cache: pnpm

            - name: Validate inputs
              shell: bash
              env:
                  CONFIG: ${{ inputs.config }}
              run: |
                  set -euo pipefail
                  [[ "$CONFIG" == "seventwos.org/release" || "$CONFIG" == "seventwos.org/preview" ]]
                  test -f "apps/desktop/$CONFIG/build.json"
                  test -f "apps/desktop/$CONFIG/config.json"
                  python3 scripts/upstream/validate_policy.py

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --filter seventwos-workspace-desktop... --filter element-web...

            - name: Build web app from source
              env:
                  NODE_OPTIONS: --max-old-space-size=4096
              run: pnpm --filter element-web build

            - name: Package local web build
              working-directory: apps/desktop
              shell: bash
              env:
                  CONFIG: ${{ inputs.config }}
              run: |
                  set -euo pipefail
                  node scripts/package-webapp.ts --cfgdir "$CONFIG" --no-set-version
                  cp "$CONFIG/build.json" variant.json

            - name: Generate native cache inputs
              working-directory: apps/desktop
              shell: bash
              run: |
                  set -euo pipefail
                  pnpm --silent electron --no-sandbox --version > electronVersion
                  jq -c .hakDependencies package.json | sha1sum > hakHash
                  find hak scripts/hak -type f -print0 | sort -z | xargs -0 sha1sum >> hakHash

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: desktop-prepare
                  retention-days: 1
                  if-no-files-found: error
                  path: |
                      apps/desktop/webapp.asar
                      apps/desktop/electronVersion
                      apps/desktop/hakHash
                      apps/desktop/variant.json
