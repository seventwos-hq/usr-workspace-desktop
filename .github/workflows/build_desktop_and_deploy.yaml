name: Build Seventwos Desktop Artifacts

on:
    workflow_dispatch:
        inputs:
            variant:
                description: "Seventwos desktop build variant"
                required: true
                default: release
                type: choice
                options:
                    - release
                    - preview
            macos:
                description: "Build macOS artifacts"
                required: true
                type: boolean
                default: true
            windows:
                description: "Build Windows artifacts"
                required: true
                type: boolean
                default: true
            linux:
                description: "Build Linux artifacts"
                required: true
                type: boolean
                default: true

run-name: Seventwos Workspace Desktop (${{ inputs.variant }})
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false
permissions:
    contents: read

jobs:
    prepare:
        uses: ./.github/workflows/build_desktop_prepare.yaml
        permissions:
            contents: read
        with:
            config: seventwos.com/${{ inputs.variant }}

    windows:
        if: inputs.windows
        needs: prepare
        name: Windows ${{ matrix.arch }}
        strategy:
            matrix:
                arch: [x64, arm64]
        uses: ./.github/workflows/build_desktop_windows.yaml
        secrets:
            SEVENTWOS_WORKSPACE_SIGNTOOL_SUBJECT_NAME: ${{ secrets.SEVENTWOS_WORKSPACE_SIGNTOOL_SUBJECT_NAME }}
            SEVENTWOS_WORKSPACE_SIGNTOOL_THUMBPRINT: ${{ secrets.SEVENTWOS_WORKSPACE_SIGNTOOL_THUMBPRINT }}
        with:
            arch: ${{ matrix.arch }}
            test: false

    macos:
        if: inputs.macos
        needs: prepare
        name: macOS
        uses: ./.github/workflows/build_desktop_macos.yaml
        secrets:
            SEVENTWOS_WORKSPACE_APPLE_TEAM_ID: ${{ secrets.SEVENTWOS_WORKSPACE_APPLE_TEAM_ID }}
            APPLE_ID: ${{ secrets.APPLE_ID }}
            APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
            APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
            APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
            APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
            APPLE_KEYCHAIN: ${{ secrets.APPLE_KEYCHAIN }}
            APPLE_KEYCHAIN_PROFILE: ${{ secrets.APPLE_KEYCHAIN_PROFILE }}
        with:
            test: false

    linux:
        if: inputs.linux
        needs: prepare
        name: Linux ${{ matrix.arch }}
        strategy:
            matrix:
                arch: [amd64, arm64]
        uses: ./.github/workflows/build_desktop_linux.yaml
        with:
            arch: ${{ matrix.arch }}
            sqlcipher: static
            test: false
