name: Prepare Seventwos Desktop Build

on:
    workflow_call:
        inputs:
            config:
                type: string
                required: true
                description: "Repository-relative config directory under apps/desktop"

permissions:
    contents: read

jobs:
    prepare:
        name: Verify and prepare pinned web bundle
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: apps/desktop/.node-version
                  cache: pnpm

            - name: Validate inputs
              shell: bash
              env:
                  CONFIG: ${{ inputs.config }}
                  EVENT_NAME: ${{ github.event_name }}
                  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
                  REF_TYPE: ${{ github.ref_type }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  [[ "$CONFIG" == "seventwos.com/release" || "$CONFIG" == "seventwos.com/preview" ]]
                  test -f "apps/desktop/$CONFIG/build.json"
                  test -f "apps/desktop/$CONFIG/config.json"
                  git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
                  if [[ "$EVENT_NAME" == "pull_request" ]]; then
                      BASE="$PR_BASE_SHA"
                  elif [[ "$EVENT_NAME" == "merge_group" ]]; then
                      BASE="$MERGE_GROUP_BASE_SHA"
                  elif [[ "$REF_TYPE" == "tag" ]]; then
                      git merge-base --is-ancestor HEAD origin/main
                      BASE="origin/main"
                  elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REF_TYPE" == "branch" && "$REF_NAME" == "main" ]]; then
                      BASE="origin/main"
                  else
                      printf "cannot determine trusted upstream base for event %s, ref type %s, ref %s\n" "$EVENT_NAME" "$REF_TYPE" "$REF_NAME" >&2
                      exit 1
                  fi
                  test -n "$BASE"
                  if [[ "$BASE" != origin/* ]]; then
                      git fetch --no-tags origin "$BASE"
                  fi
                  git rev-parse --verify "${BASE}^{commit}" >/dev/null
                  python3 scripts/upstream/upstream_verify.py --base "$BASE" --head HEAD --verify-head

            - name: Install build dependencies
              run: pnpm install --frozen-lockfile

            - name: Build and package the patched web application
              shell: bash
              env:
                  CONFIG: ${{ inputs.config }}
              run: |
                  set -euo pipefail
                  python3 scripts/upstream/apply_patches.py --root .
                  VERSION="$(node -p 'require("./apps/desktop/package.json").version')" pnpm --dir apps/web build
                  cp "apps/desktop/$CONFIG/config.json" apps/web/webapp/config.json
                  pnpm --dir apps/desktop exec asar pack ../../apps/web/webapp webapp.asar
                  cp "apps/desktop/$CONFIG/build.json" apps/desktop/variant.json

            - name: Generate native cache inputs
              working-directory: apps/desktop
              shell: bash
              run: |
                  set -euo pipefail
                  pnpm --silent electron --no-sandbox --version > electronVersion
                  jq -c .hakDependencies package.json | sha1sum > hakHash
                  find hak scripts/hak -type f -print0 | sort -z | xargs -0 sha1sum >> hakHash

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: desktop-prepare
                  retention-days: 1
                  if-no-files-found: error
                  path: |
                      apps/desktop/webapp.asar
                      apps/desktop/electronVersion
                      apps/desktop/hakHash
                      apps/desktop/variant.json
