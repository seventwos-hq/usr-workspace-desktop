name: pr-check
on: pull_request
permissions:
  contents: read
concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pr-check:
    # runner executes one job at a time: keep everything in one sequential job
    runs-on: dev-vm
    container: node:24-bookworm
    timeout-minutes: 60
    env:
      # registry.npmjs.org is slow/flaky from the dev VM: retry hard, fewer parallel fetches
      npm_config_fetch_retries: "8"
      npm_config_fetch_retry_mintimeout: "10000"
      npm_config_fetch_retry_maxtimeout: "120000"
      npm_config_fetch_timeout: "600000"
      npm_config_network_concurrency: "6"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trust workspace (container runs as another uid than checkout)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Brand guard
        run: scripts/brand-guard.sh
      - name: Upstream policy (.seventwos)
        run: |
          python3 scripts/upstream/validate_policy.py
          python3 -m unittest discover -s scripts/upstream
      - run: |
          corepack enable
          pnpm config set --location=global store-dir /tmp/pnpm-store
          pnpm install --frozen-lockfile --network-concurrency=6 --fetch-retries=8 --fetch-timeout=600000
      # report-only: develop already has 1 oxlint error (I18nApi.ts no-unnecessary-type-assertion) + warnings over the cap; fix upstream separately
      - run: pnpm lint:js
        continue-on-error: true
      # report-only: develop already fails desktop lint:types (src/vectormenu.test.ts: Cannot find name KeyboardEvent)
      - run: pnpm -r --workspace-concurrency=1 lint:types
        continue-on-error: true
      - name: Build web app from source
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --filter element-web build
      - name: Desktop packaging uses the local web build
        working-directory: apps/desktop
        run: |
          node scripts/package-webapp.ts --cfgdir "" --no-set-version
          test -s webapp.asar
          ! grep -rn "fetch-package\|importkey" package.json scripts
      # desktop unit tests only: root test:unit also runs browser (playwright) projects that need chromium, absent on the runner
      - run: pnpm --filter seventwos-workspace-desktop exec vitest run
