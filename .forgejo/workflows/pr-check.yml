name: pr-check
on: pull_request
permissions:
  contents: read
jobs:
  pr-check:
    runs-on: dev-vm-heavy
    container: node:24-bookworm
    timeout-minutes: 40
    env:
      # registry.npmjs.org is slow/flaky from the dev VM: retry hard, fewer parallel fetches
      npm_config_fetch_retries: "8"
      npm_config_fetch_retry_mintimeout: "10000"
      npm_config_fetch_retry_maxtimeout: "120000"
      npm_config_fetch_timeout: "600000"
      npm_config_network_concurrency: "6"
    steps:
      - uses: actions/checkout@v4
      - run: |
          corepack enable
          pnpm config set --location=global store-dir /tmp/pnpm-store
          pnpm install --frozen-lockfile --network-concurrency=6 --fetch-retries=8 --fetch-timeout=600000
      - run: pnpm lint:js
      - run: pnpm -r --workspace-concurrency=1 lint:types
      # desktop unit tests only: root test:unit also runs browser (playwright) projects that need chromium, absent on the runner
      - run: pnpm --filter seventwos-workspace-desktop exec vitest run

  # Semgrep CE (OSS CLI, no login/app/metrics). REPORT-ONLY: never fails the check.
  # Plan: propose making it blocking (drop `|| true`, use --error) after 2 weeks of reports.
  semgrep:
    runs-on: dev-vm
    container: python:3.12-bookworm
    timeout-minutes: 20
    continue-on-error: true
    env:
      SEMGREP_VERSION: "1.185.0"
      SEMGREP_SEND_METRICS: "off"
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends nodejs git || true
      - uses: actions/checkout@v4
      - name: Semgrep CE scan (report-only)
        run: |
          python3 -m venv /tmp/sg
          /tmp/sg/bin/pip install --quiet "semgrep==${SEMGREP_VERSION}"
          /tmp/sg/bin/semgrep --version
          /tmp/sg/bin/semgrep scan --config p/default --metrics=off --disable-version-check \
            --jobs 1 --max-memory 1500 --timeout 20 --error=false --quiet --text --output /tmp/semgrep.txt || true
          echo "=== Semgrep findings (report-only) ==="
          tail -n 200 /tmp/semgrep.txt || true
          grep -cE '^ +❯❯' /tmp/semgrep.txt || true
