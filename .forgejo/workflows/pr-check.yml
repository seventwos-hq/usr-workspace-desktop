name: pr-check
on: pull_request
permissions:
  contents: read
jobs:
  pr-check:
    runs-on: dev-vm
    container: node:24-bookworm
    timeout-minutes: 40
    env:
      # registry.npmjs.org is slow/flaky from the dev VM: retry hard, fewer parallel fetches
      npm_config_fetch_retries: "8"
      npm_config_fetch_retry_mintimeout: "10000"
      npm_config_fetch_retry_maxtimeout: "120000"
      npm_config_fetch_timeout: "600000"
      npm_config_network_concurrency: "6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            /tmp/pnpm-store
            /tmp/pnpm-cache
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-
      - run: |
          corepack enable
          pnpm config set --location=global store-dir /tmp/pnpm-store
          pnpm config set --location=global cache-dir /tmp/pnpm-cache
          pnpm install --frozen-lockfile --network-concurrency=6 --fetch-retries=8 --fetch-timeout=600000
      # report-only: develop already has 1 oxlint error (I18nApi.ts no-unnecessary-type-assertion) + warnings over the cap; fix upstream separately
      - run: pnpm lint:js
        continue-on-error: true
      - run: pnpm -r --workspace-concurrency=1 lint:types
      - run: pnpm test:unit
