name: Build Seventwos Desktop Artifacts

on:
    workflow_dispatch:
        inputs:
            variant:
                description: "Seventwos desktop build variant"
                required: true
                default: release
                type: choice
                options:
                    - release
                    - preview
            macos:
                description: "Build unsigned macOS artifacts"
                required: true
                type: boolean
                default: true
            windows:
                description: "Build unsigned Windows artifacts"
                required: true
                type: boolean
                default: true
            linux:
                description: "Build Linux artifacts"
                required: true
                type: boolean
                default: true

run-name: Seventwos Workspace Desktop (${{ inputs.variant }})
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false
permissions:
    contents: read

jobs:
    prepare:
        uses: ./.github/workflows/build_desktop_prepare.yaml
        permissions:
            contents: read
        with:
            config: seventwos.org/${{ inputs.variant }}

    windows:
        if: inputs.windows
        needs: prepare
        name: Windows ${{ matrix.arch }} (unsigned)
        strategy:
            matrix:
                arch: [x64, arm64]
        uses: ./.github/workflows/build_desktop_windows.yaml
        with:
            arch: ${{ matrix.arch }}
            test: false

    macos:
        if: inputs.macos
        needs: prepare
        name: macOS (unsigned)
        uses: ./.github/workflows/build_desktop_macos.yaml
        with:
            test: false

    linux:
        if: inputs.linux
        needs: prepare
        name: Linux ${{ matrix.arch }}
        strategy:
            matrix:
                arch: [amd64, arm64]
        uses: ./.github/workflows/build_desktop_linux.yaml
        with:
            arch: ${{ matrix.arch }}
            sqlcipher: static
            test: false
